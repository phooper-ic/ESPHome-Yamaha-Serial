esphome:
  name: yamaha-rxv1900
  friendly_name: Yamaha RX-V1900

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  services:
    - service: yamaha_raw_command
      variables:
        command: string
      then:
        - yamaha_serial.raw_command:
            id: yamaha
            command: !lambda "return command;"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

external_components:
  - source: github://memphi2/ESPHome-Yamaha-Serial
    components: [yamaha_serial]

# UART side is TTL (ESP), receiver side is RS-232.
# Use MAX3232 or equivalent converter, do not wire DB9 directly to GPIO.
# On the receiver, set ADVANCED SETUP > RS-232C STANDBY to YES (the default is NO
# outside the US/Canada), otherwise it cannot be controlled from standby.
uart:
  - id: uart_yamaha
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

# No inputs: block is needed. The RX-V1900 profile already has the receiver's
# inputs: PHONO, CD, Tuner, MD/CD-R, DVD, BD/HD DVD, TV, CBL/SAT, VCR, DVR,
# V-AUX, USB, Multi CH and DOCK. DOCK (and the 7ch Enhancer program) has no known
# select command: it shows in HA when chosen on the receiver but cannot be selected.
yamaha_serial:
  id: yamaha
  uart_id: uart_yamaha
  model: "RX-V1900"
  receiver_profile: rx_v1900_extended
  poll_interval: never
  diagnostics_interval: 60s
  # Enables the explicit raw API service and raw media-player shortcuts.
  allow_raw_commands: true
  command_timeout: 1500ms
  max_retries: 2
  command_spacing: 120ms
  power_on_delay: 2s
  volume:
    min: -80
    # Full receiver range; lower max to cap the volume from HA.
    max: 16.5
    step: 0.5

media_player:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    receiver:
      name: Yamaha Receiver

# The RX-V1900 has no Speaker A/B relays, fan control or night mode
# (it uses Adaptive DRC), so those entities are left out.
switch:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    zone2_power:
      name: Yamaha Zone2 Power
    zone2_mute:
      name: Yamaha Zone2 Mute
    pure_direct:
      name: Yamaha Pure Direct

button:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    refresh:
      name: Yamaha Refresh
    receiver_reset:
      name: Yamaha Receiver Reset
    tuner_auto_up:
      name: Yamaha Tuner Auto Up
    tuner_auto_down:
      name: Yamaha Tuner Auto Down
  - platform: restart
    name: Yamaha ESP Restart

number:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    # Range and step default to the yamaha_serial volume block.
    zone2_volume_db:
      name: Yamaha Zone2 Volume dB
    bass:
      name: Yamaha Bass
      min_value: 0
      max_value: 100
      step: 1
    treble:
      name: Yamaha Treble
      min_value: 0
      max_value: 100
      step: 1
    center_distance:
      name: Yamaha Center Distance
      min_value: 30
      max_value: 2400
      step: 1
    front_left_distance:
      name: Yamaha Front Left Distance
      min_value: 30
      max_value: 2400
      step: 1
    front_right_distance:
      name: Yamaha Front Right Distance
      min_value: 30
      max_value: 2400
      step: 1
    surround_left_distance:
      name: Yamaha Surround Left Distance
      min_value: 30
      max_value: 2400
      step: 1
    surround_right_distance:
      name: Yamaha Surround Right Distance
      min_value: 30
      max_value: 2400
      step: 1
    subwoofer_distance:
      name: Yamaha Subwoofer Distance
      min_value: 30
      max_value: 2400
      step: 1
    dimmer:
      name: Yamaha Dimmer
      min_value: 0
      max_value: 100
      step: 25
    # Tuner ranges are regional. Europe/UK: FM 87.5-108 MHz (0.05 MHz steps),
    # AM 531-1611 kHz (9 kHz steps). US/Canada: FM 87.5-107.9 MHz (0.2 MHz steps),
    # AM 530-1710 kHz (10 kHz steps). Front-panel tuning sends no serial report, so
    # the frequency only refreshes on Refresh or after setting it from HA.
    tuner_fm_frequency:
      name: Yamaha FM Frequency
      min_value: 87.5
      max_value: 108
      step: 0.05
    tuner_am_frequency:
      name: Yamaha AM Frequency
      min_value: 531
      max_value: 1611
      step: 9

select:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    input_source:
      name: Yamaha Input
    zone2_input_source:
      name: Yamaha Zone2 Input
    program:
      name: Yamaha Program
    # Loads System Memory 1-6 on the RX-V1900, which overwrites many settings at once.
    scene:
      name: Yamaha System Memory
    audio_select:
      name: Yamaha Audio Select
    tuner_preset:
      name: Yamaha Tuner Preset
    tuner_preset_page:
      name: Yamaha Tuner Preset Page
    tuner_band:
      name: Yamaha Tuner Band
    sleep_timer:
      name: Yamaha Sleep Timer
    # Pro Logic / PLII / Neo:6 decoder for 2ch and analog sources. Selecting one
    # switches the program to Surround Decode first; digital sources ignore it.
    surround_decoder:
      name: Yamaha Surround Decoder
    # decoder_mode (Auto/DTS/AAC) is left out: the RX-V1900 ignores it.
    # speaker_b_assignment and zone2_amp are left out: their x500/x600 commands
    # have not been tested on the RX-V1900.
    # EX and PLIIx Movie/Music need surround back speakers.
    extended_surround:
      name: Yamaha Extended Surround

sensor:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    volume_db:
      name: Yamaha Volume dB
    zone2_volume_db:
      name: Yamaha Zone2 Volume dB
    sampling_rate:
      name: Yamaha Sampling Rate
    last_response_age:
      name: Yamaha Last Response Age
      disabled_by_default: true
    commands_sent:
      name: Yamaha Commands Sent
      disabled_by_default: true
    responses_received:
      name: Yamaha Responses Received
      disabled_by_default: true
    parse_errors:
      name: Yamaha Parse Errors
      disabled_by_default: true
    timeouts:
      name: Yamaha Timeouts
      disabled_by_default: true
    queue_drops:
      name: Yamaha Queue Drops
      disabled_by_default: true

text_sensor:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    input_source:
      name: Yamaha Input Name
    zone2_input_source:
      name: Yamaha Zone2 Input Name
    playback_format:
      name: Yamaha Playback Format
    receiver_model:
      name: Yamaha Receiver Model
    connection_state:
      name: Yamaha Connection State
    last_error:
      name: Yamaha Last Error
      disabled_by_default: true
    last_parse_error:
      name: Yamaha Last Parse Error
      disabled_by_default: true

binary_sensor:
  - platform: yamaha_serial
    yamaha_serial_id: yamaha
    availability:
      name: Yamaha Availability
